<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#49473f",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#494948",
                        "on-surface": "#1a1c1a",
                        "secondary-fixed-dim": "#cac6bc",
                        "surface-container": "#efeeeb",
                        "surface-container-low": "#f4f3f1",
                        "primary-container": "#d2b48c",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#e3e2e0",
                        "primary": "#725a39",
                        "inverse-on-surface": "#f2f1ee",
                        "secondary": "#615e56",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dbdad7",
                        "surface": "#faf9f6",
                        "secondary-container": "#e4dfd5",
                        "tertiary-container": "#b9b9b7",
                        "surface-container-high": "#e9e8e5",
                        "tertiary": "#5e5e5d",
                        "on-primary-fixed": "#281801",
                        "on-primary-container": "#5b4526",
                        "tertiary-fixed-dim": "#c7c6c4",
                        "on-surface-variant": "#4d453c",
                        "outline": "#7f766a",
                        "on-tertiary-fixed-variant": "#464746",
                        "on-tertiary-fixed": "#1b1c1b",
                        "inverse-primary": "#e1c299",
                        "outline-variant": "#d1c5b8",
                        "on-secondary-fixed": "#1d1c15",
                        "inverse-surface": "#2f312f",
                        "on-primary-fixed-variant": "#584324",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e3e2e0",
                        "on-secondary-container": "#65635a",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#e1c299",
                        "surface-variant": "#e3e2e0",
                        "surface-bright": "#faf9f6",
                        "primary-fixed": "#feddb3",
                        "surface-tint": "#725a39",
                        "secondary-fixed": "#e7e2d8",
                        "background": "#faf9f6",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1a1c1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "unit": "8px",
                        "section-padding": "80px",
                        "gutter": "24px",
                        "container-max": "1140px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Newsreader"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Newsreader"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Newsreader"],
                        "headline-lg-mobile": ["Newsreader"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-xl": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar hiding for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col relative overflow-hidden font-body-md md:max-w-md md:mx-auto md:border-x md:border-outline-variant/20 shadow-2xl">
<!-- Top App Bar (Task-Focused Overlay) -->
<header class="absolute top-0 left-0 right-0 z-40 bg-surface/80 backdrop-blur-xl flex justify-between items-center px-4 py-4 border-b border-outline-variant/10">
<button class="w-10 h-10 flex items-center justify-center bg-surface-container-low rounded-full text-primary hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-primary font-bold">Procession Mode</h1>
<p class="font-label-sm text-label-sm text-secondary mt-1 tracking-widest">ALPHA TEAM CONVOY</p>
</div>
<button class="w-10 h-10 flex items-center justify-center text-primary relative">
<span class="material-symbols-outlined">group</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-primary-container rounded-full border border-surface"></span>
</button>
</header>
<!-- Main Map Canvas -->
<main class="flex-1 w-full h-full relative bg-surface-variant">
<!-- Map Image Placeholder -->
<div class="absolute inset-0 w-full h-full bg-surface-container">
<img alt="Procession Route Map" class="w-full h-full object-cover opacity-70 grayscale-[30%] contrast-125 sepia-[20%]" data-alt="A highly stylized, minimalist digital map interface showing a rural route in Provence. The map utilizes a pure, light-mode color palette dominated by warm off-whites, soft linen textures, and thin elegant lines representing country roads. The aesthetic is extremely clean, resembling a high-end editorial infographic or luxury stationery rather than a standard commercial GPS. The overall mood is calm, organized, and organic, perfectly suited for a premium wedding planning tool." data-location="Provence, France" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeMQzIFqDwf9NQiKr-zcy2ycWdz9mX5v-6YRFnAiLOcmAaxc1sioJMnv5w8Xav9m2s9v4svlT8ELM-z7vJQA0Qdv43x458Kj7e9Ko-AK83EcYxp6MaPTegyc_rL8R1rmIS3Lys5idvEKsAbYUVDPaL2Xl5hMQo4twWTzcowywO4isOLSEYVKhIjJLM8nZ2JD3ydxpOyLFtIhlYQU38ZQEdRPoiXrihHyupKiOzUvCRvmSJw5yhBhiI8O5Yy3WDHy-wg5_eDRh1PfzR"/>
</div>
<!-- Simulated Route Path (SVG overlay for aesthetic) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 100 100">
<path class="opacity-60" d="M 20,80 Q 40,60 60,70 T 80,30" fill="none" stroke="#725a39" stroke-dasharray="2 1" stroke-width="0.8"></path>
</svg>
<!-- Current Vehicle Marker -->
<div class="absolute top-[65%] left-[55%] -translate-x-1/2 -translate-y-1/2 z-20 flex items-center justify-center">
<div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center">
<div class="w-10 h-10 bg-primary/20 rounded-full flex items-center justify-center">
<div class="w-4 h-4 bg-primary rounded-full shadow-lg border-2 border-surface"></div>
</div>
</div>
</div>
<!-- Convoy Member Marker (Ahead) -->
<div class="absolute top-[35%] left-[75%] -translate-x-1/2 -translate-y-1/2 z-10 flex flex-col items-center">
<div class="bg-surface px-2 py-1 rounded shadow-sm border border-outline-variant/20 mb-1">
<span class="font-label-sm text-label-sm text-secondary">Lead Car</span>
</div>
<div class="w-3 h-3 bg-secondary rounded-full border-2 border-surface shadow-sm"></div>
</div>
<!-- Key Metrics Panel (Glassmorphism) -->
<div class="absolute top-24 left-4 right-4 z-30 bg-surface/75 backdrop-blur-2xl rounded-2xl p-4 flex justify-between items-center border border-outline-variant/10 shadow-sm">
<div class="flex flex-col items-center flex-1">
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase mb-1">Speed</span>
<div class="flex items-baseline gap-1">
<span class="font-headline-md text-headline-md text-on-surface">42</span>
<span class="font-body-md text-body-md text-secondary text-sm">km/h</span>
</div>
</div>
<div class="w-px h-12 bg-outline-variant/20"></div>
<div class="flex flex-col items-center flex-1">
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase mb-1">ETA</span>
<span class="font-headline-md text-headline-md text-primary">15:45</span>
</div>
<div class="w-px h-12 bg-outline-variant/20"></div>
<div class="flex flex-col items-center flex-1">
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase mb-1">Distance</span>
<div class="flex items-baseline gap-1">
<span class="font-headline-md text-headline-md text-on-surface">8.4</span>
<span class="font-body-md text-body-md text-secondary text-sm">km</span>
</div>
</div>
</div>
<!-- Broadcast / PTT Floating Action Button -->
<button class="absolute bottom-[280px] right-6 z-30 w-16 h-16 bg-primary text-on-primary rounded-full shadow-[0_8px_30px_rgba(114,90,57,0.3)] flex items-center justify-center hover:bg-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</main>
<!-- Bottom Sheet (Action Area & Status) -->
<div class="absolute bottom-0 left-0 right-0 z-40 bg-surface rounded-t-3xl border-t border-outline-variant/10 shadow-[0_-20px_40px_rgba(0,0,0,0.03)] px-6 pt-3 pb-8">
<!-- Drag Handle -->
<div class="w-12 h-1 bg-surface-container-high rounded-full mx-auto mb-6"></div>
<div class="flex items-center justify-between mb-6">
<h2 class="font-headline-md text-headline-md text-on-surface">Convoy Status</h2>
<span class="font-label-sm text-label-sm text-primary bg-primary-container/20 px-3 py-1 rounded-full">On Schedule</span>
</div>
<!-- Quick Action Buttons (Bento-style grid) -->
<div class="grid grid-cols-3 gap-3 mb-6">
<button class="flex flex-col items-center justify-center bg-surface-container-low py-4 px-2 rounded-2xl hover:bg-surface-container transition-colors border border-transparent">
<span class="material-symbols-outlined text-secondary mb-2">traffic</span>
<span class="font-label-sm text-label-sm text-on-surface text-center">Traffic</span>
</button>
<button class="flex flex-col items-center justify-center bg-error-container/20 py-4 px-2 rounded-2xl border border-error/10 hover:bg-error-container/40 transition-colors text-error">
<span class="material-symbols-outlined mb-2">warning</span>
<span class="font-label-sm text-label-sm text-center">Problem</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container/20 py-4 px-2 rounded-2xl border border-primary/10 hover:bg-primary-container/40 transition-colors text-on-primary-container">
<span class="material-symbols-outlined mb-2">flag</span>
<span class="font-label-sm text-label-sm text-center">Arrived</span>
</button>
</div>
<!-- Next Destination Banner -->
<div class="bg-surface-container-lowest border border-outline-variant/20 rounded-2xl p-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 bg-surface-container-low rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined">church</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-secondary tracking-widest uppercase mb-1">Next Destination</p>
<p class="font-body-lg text-body-lg text-on-surface">Domaine de Valmouriane</p>
</div>
</div>
<button class="text-primary p-2">
<span class="material-symbols-outlined">directions</span>
</button>
</div>
</div>
</body></html>
